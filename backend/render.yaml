services:
  - type: web
    name: lumina-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: lumina
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: FRONTEND_URL
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_store
    disk:
      name: chroma-store
      mountPath: /app/chroma_store
      sizeGB: 1
